version: '3.8'

services:
  db:
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: 8326
      MYSQL_DATABASE: alquiler_barcos
    volumes:
      # Monta el script de DB para que se ejecute en la creación inicial (solo la primera vez)
      - ./backend/init_db.sql:/docker-entrypoint-initdb.d/init.sql
      # Persistencia de datos de la DB
      - mariadb_data:/var/lib/mysql
    ports:
      - "3306:3306"
    restart: always

  backend:
    build: 
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      # URL dinámica hacia el servicio db
      - DATABASE_URL=mysql+pymysql://root:8326@db/alquiler_barcos
    volumes:
      # Persistencia de imágenes subidas de barcos
      - ./backend/static/uploads:/app/static/uploads
    ports:
      - "5000:5000"
    depends_on:
      - db
    restart: always

  bot:
    build:
      context: ./backend
    command: python bot.py
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=mysql+pymysql://root:8326@db/alquiler_barcos
    depends_on:
      - db
    restart: always

  frontend:
    build:
      context: ./frontend
    ports:
      # Exponemos en 5173 para respetar tu flujo local, el nginx interno usa el 80
      - "5173:80"
    depends_on:
      - backend
    restart: always

volumes:
  mariadb_data:
